name: Build Installers (跨平台构建)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pyside6 pyinstaller

      - name: Build with PyInstaller
        run: |
          pyinstaller --noconfirm --windowed --name "AI Audit" --add-data "gui:gui" run_gui.py

      - name: Create installer (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Write-Host "Building Windows installer..."
          Copy-Item "dist/AI Audit/AI Audit.exe" "dist/AI-Audit-Windows.exe"

      - name: Create installer (macOS)
        if: runner.os == 'macOS'
        run: |
          echo "Building macOS app bundle..."
          hdiutil create -volname "AI Audit" -srcfolder "dist/AI Audit.app" -ov -format UDZO "dist/AI-Audit-macOS.dmg"

      - name: Create installer (Linux)
        if: runner.os == 'Linux'
        run: |
          echo "Building Linux AppImage..."
          tar -czf "dist/AI-Audit-Linux.tar.gz" -C dist "AI Audit"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.tar.gz

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/*.exe
            dist/*.dmg
            dist/*.tar.gz
