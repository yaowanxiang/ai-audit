---
name: Feature Request
description: Suggest a new feature for AI Audit
title: "[FEATURE]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a new feature!
  - type: textarea
    id: feature
    attributes:
      label: Feature Description
      description: What feature would you like to add?
      placeholder: Describe the feature in detail.
    validations:
      required: true
  - type: textarea
    id: usecase
    attributes:
      label: Use Case
      description: What is the use case for this feature?
      placeholder: When would this feature be used?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How do you suggest implementing this feature?
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: What alternatives have you considered?
    validations:
      required: false
